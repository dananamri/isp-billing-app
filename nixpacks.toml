# Nixpacks config for Laravel 12 + Livewire + Tailwind CSS v4

[variables]
NIXPACKS_NODE_VERSION = "22"
NIXPACKS_PHP_ROOT_DIR = "/public"

[phases.setup]
nixPkgs = [
  "php82",
  "php82Extensions.pdo_mysql",
  "php82Extensions.mbstring",
  "php82Extensions.bcmath",
  "php82Extensions.xml",
  "php82Extensions.curl",
  "php82Extensions.zip",
  "php82Extensions.gd",
  "php82Extensions.intl",
  "php82Packages.composer",
  "nodejs_22",
  "nginx"
]

[phases.install]
cmds = [
  "mkdir -p /var/log/nginx /var/cache/nginx /app/storage/framework/cache /app/storage/framework/sessions /app/storage/framework/views /app/storage/logs",
  "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
  "npm ci --include=dev"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan storage:link --force || true; php artisan config:cache; php artisan route:cache; php artisan view:cache; node /assets/scripts/prestart.mjs /assets/nginx.template.conf /nginx.conf && (php-fpm -y /assets/php-fpm.conf & nginx -c /nginx.conf)"
